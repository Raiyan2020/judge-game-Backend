; PHP runtime limits for the Judge Game API (read by php-fpm / CGI under
; cPanel ea-php — `php_value` in .htaccess is ignored on this handler, so the
; upload limits MUST live here).
;
; Case evidence allows video up to 50 MB (LegalCaseRequest `videos.*|max:51200`)
; and audio up to 20 MB. Stock PHP defaults (upload_max_filesize=2M,
; post_max_size=8M) silently drop anything larger BEFORE Laravel validation
; runs, so a valid camera clip arrived with an empty $_FILES and the request
; failed with "فشل في الرفع". These ceilings sit comfortably above the 50 MB
; app cap (post_max_size must exceed upload_max_filesize to leave room for the
; other multipart fields).
upload_max_filesize = 60M
post_max_size = 64M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
